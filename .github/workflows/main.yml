name: Test and Build docker-react app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dev:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build dev image
        run: docker build -f Dockerfile.dev -t techied29/frontend .

      - name: run tests
        run: docker run -e CI=true techied29/frontend npm run test

  prod:
    needs: dev
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build production image
        run: docker build -t techied29/frontend .

      - name: Smoke test the nginx container
        run: |
          docker run -d -p 8080:80 --name docker-react techied29/frontend:latest
          sleep 3
          curl --fail http://localhost:8080
          docker stop docker-react

      - name: Create deployment package
        if: github.event_name == 'push'
        run: zip -r deploy.zip . -x '*.git*' 'node_modules/*' 'dist/*'

      - name: Deploy to AWS Elastic Beanstalk
        if: github.event_name == 'push'
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws-access-key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: us-east-2
          application-name: Docker-react
          environment-name: docker-react-env
          existing-bucket-name: elasticbeanstalk-us-east-2-992903864012
          aws-bucket-path: Docker-react
          version_label: ${{ github.sha }}
          deployment-package: deploy.zip

      
