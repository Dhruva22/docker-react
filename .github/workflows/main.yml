name: Test and Build docker-react app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dev:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build dev image
        run: docker build -f Dockerfile.dev -t techied29/frontend .

      - name: run tests
        run: docker run -e CI=true techied29/frontend npm run test

  prod:
    needs: dev
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build production image
        run: docker build -t techied29/frontend .

      - name: Smoke test the nginx container
        run: |
          docker run -d -p 5173:80 --name docker-react techied29/frontend:latest

      - name: Deploy to AWS Elastic Beanstalk
        uses: aws-actions/amazon-elastic-beanstalk-deploy@v1.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          aws-application-name: docker-react
          aws-environment-name: docker-react-env
          aws-bucket-name: elasticbeanstalk-us-east-2-992903864012
          aws-bucket-path: docker-react

      
